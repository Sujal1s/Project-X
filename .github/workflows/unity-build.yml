name: Unity Build

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v2

      # Set up Unity
      - name: Set up Unity
        uses: game-ci/unity-builder@v2
        with:
          unityVersion: 2021.3.11f1 # Change this to your Unity version

      # Build the project
      - name: Build project
        uses: game-ci/unity-builder@v2
        with:
          targetPlatform: StandaloneWindows64 # Change this to your target platform
